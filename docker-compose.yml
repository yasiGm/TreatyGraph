# Local SQL Server for development. Data lives in the named volume "sqldata".
# The password below is a throw-away DEV password for a container that only listens on localhost.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64          # needed on Apple Silicon (Docker Desktop runs it through emulation)
    container_name: treatygraph-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Passw0rd!"
    ports:
      - "1433:1433"
    volumes:
      - sqldata:/var/opt/mssql

volumes:
  sqldata:
